<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <link rel="stylesheet" href="table_style.css">
</head>

<body>

    <video id="background" autoplay loop muted>
        <source src="media/background.mp4" type="video/mp4">
    </video>

    <div class="container" id="table_cont">
        <h2>Class Information Form</h2>
        <form id="classForm">
            <label for="className">Class Name</label>
            <input type="text" id="className" name="className" required>

            <label for="numPeople">Number of People</label>
            <input type="number" id="numPeople" name="numPeople" required>

            <label for="description">Description</label>
            <input type="text" id="description" name="description" required>

            <button type="submit">Add Class</button>
        </form>

        <h2>Class List (Double Click to Remove a Class)</h2>
        
        <div id="classTableContainer">
            <table id="classTable">
                <thead>
                    <tr>
                        <th>Class Name</th>
                        <th>Number of People</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>

    <script src="table_func.js"></script>
</body>

</html>
